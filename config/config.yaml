data:
  dataset: electricity
  format: csv
  path: ../datasets/
  indiv_split: ../datasets/indiv
  date_split: ../datasets/date
  subset:
    train: ../datasets/train_subset_indices_0.1.pt
    valid: ../datasets/valid_subset_indices_0.1.pt
    valid2: ../datasets/valid2_subset_indices_0.1.pt
    test: ../datasets/test_subset_indices_0.1.pt
  seed:
  mean: 2500
  std: 15000

fed:
  splits:
    ../datasets/node_0_indices.pt: ../datasets/node_0/date #- 0.5- 0.3- 0.2
    ../datasets/node_1_indices.pt: ../datasets/node_1/date #- 0.5- 0.3- 0.2 
    ../datasets/node_2_indices.pt: ../datasets/node_2/date #- 0.5- 0.3- 0.2 
  subsets:
    node0:
      train: ../datasets/node_0/train_subset_indices_0.1.pt
      valid: ../datasets/node_0/valid_subset_indices_0.1.pt
      test: ../datasets/node_0/test_subset_indices_0.1.pt
    node1:
      train: ../datasets/node_0/train_subset_indices_0.1.pt
      valid: ../datasets/node_0/valid_subset_indices_0.1.pt
      test: ../datasets/node_0/test_subset_indices_0.1.pt
    node2:
      train: ../datasets/node_0/train_subset_indices_0.1.pt
      valid: ../datasets/node_0/valid_subset_indices_0.1.pt
      test: ../datasets/node_0/test_subset_indices_0.1.pt
  epochs: 3
  rounds: 5

model:
  lags: 336
  horizon: 24
  name: linear
  normalization: 1

training:
  retrain: True
  loss: NMSE
  bs: 4
  lr: 0.0001
  epochs: 1

misc:
  seed:
  output_dir: ../outputs/
  benchmark: False
  save_name:
  verbose: True
  table_coeffs:
    - -5
    - 4
    - 1
    - -2
    - 1

defaults:
  - _self_
  - model_configs: linear