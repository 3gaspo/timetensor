data:
  dataset: electricity
  format: csv
  path: ../datasets/electricity/
  indiv_split: ../datasets/electricity/splits/indiv
  date_split: ../datasets/electricity/splits/date
  seed:
  mean: 2500
  std: 15000

model:
  lags: 336
  horizon: 24
  name: linear
  normalization: 1

training:
  retrain: True
  loss: MMSE
  bs: 4
  lr: 0.0001
  epochs: 1

misc:
  seed:
  output_dir: ../outputs/
  benchmark: False
  save_name:
  verbose: 1

defaults:
  - _self_
  - model_configs: linear
  - fed: fed
  - subset: full