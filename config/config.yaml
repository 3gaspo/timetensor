data:
  dataset: electricity
  path: ../datasets/
  rebuild: False
  reset: False
  example_name : rand
  format: csv
  indiv_split: 0.7
  date_split: 0.7
  seed:

fed:
  splits: [0.2, 0.5, 0.3]

model:
  lags: 336
  horizon: 24
  name: linear
  revin: False

training:
  retrain: True
  loss: MSE
  normalized: True
  bs: 4
  subset_data: 0.2
  lr: 0.0001

misc:
  seed:
  output_dir: outputs/
  save_name:
  verbose: True

defaults:
  - _self_
  - model_configs: linear