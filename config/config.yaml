data:
  dataset: synthetic
  format: csv
  path: ../datasets/synthetic/
  indiv_split: ../datasets/synthetic/splits/indiv #0.7 
  date_split: ../datasets/synthetic/splits/date #0.7 
  by_idx: dates
  seed:
  mean: 560
  std: 330

model:
  lags: 336
  horizon: 24
  name: DLinear
  normalization: global

training:
  retrain: True
  loss: MMSE
  bs: 32
  lr: 0.0001
  epochs: 10
  eval_freq: 10
  print_freq: 50

misc:
  seed:
  output_dir: ../outputs/
  benchmark: False
  save_name:
  verbose: 1

defaults:
  - _self_
  - model_configs: DLinear
  - fed: fed_all
  - subset: full