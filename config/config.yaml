data:
  dataset: electricity
  format: csv
  path: ../datasets/
  indiv_split: 0.7
  date_split: 0.7
  subset:
    train: 0.1
    valid: 1
    valid2: 1
    test: 1
  seed:

fed:
  splits:
    ../datasets/node_0_indices.pt: [0.7, 0.7]
    ../datasets/node_1_indices.pt: [0.7, 0.7]
    ../datasets/node_2_indices.pt: [0.7, 0.7]

model:
  lags: 336
  horizon: 24
  name: linear
  revin: False

training:
  retrain: True
  loss: MSE
  normalized: True
  bs: 4
  subset_data: 0.2
  lr: 0.0001

misc:
  seed:
  output_dir: outputs/
  save_name:
  verbose: True

defaults:
  - _self_
  - model_configs: linear